[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments.json" }]

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet_public = "https://testnet-rpc.monad.xyz"
monad_local = "http://127.0.0.1:8545"

[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", url = "https://api.monadscan.com/api", chain = 143 }
